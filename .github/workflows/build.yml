name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          settings=(CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            settings+=(MARKETING_VERSION="${GITHUB_REF_NAME#v}")
          fi
          xcodebuild build -quiet \
            -project CommitBox.xcodeproj \
            -scheme CommitBox \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            "${settings[@]}"

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/CommitBox.app CommitBox.zip

      - name: Publish
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" CommitBox.zip --title "CommitBox $GITHUB_REF_NAME" --generate-notes
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest CommitBox.zip --title "Latest build" --notes "Built from $GITHUB_SHA." --prerelease --target "$GITHUB_SHA"
          fi
